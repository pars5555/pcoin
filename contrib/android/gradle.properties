org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.5.1 predates SDK 36 and would fail the build on principle; Play now
# REFUSES targetSdk 35 ("must target at least API level 36"), so the mismatch is
# deliberate and this line says so. Raised 35 -> 36 on 2026-09-06, when a
# 0.2.13 upload was blocked by exactly that error; 0.2.12 had gone through at 35
# only a week earlier, so expect this number to keep moving.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
