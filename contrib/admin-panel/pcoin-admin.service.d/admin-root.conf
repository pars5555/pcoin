[Service]
# admin.pc.am (2026-09-24): the panel owns its hostname and answers at /.
# Safe only because that hostname is locked to the owner's addresses, twice:
# Caddy's @admin_owner matcher and the panel's own check, both generated from
# /opt/pcoin-admin/allowed-ips.json by pcoin-admin-allow. ADMIN_PREFIX may stay
# set; ADMIN_ROOT wins. Remove this file to go back to the old secret path.
Environment=ADMIN_ROOT=1
