[Service]
# The wrap desk's "Mark as sent" button has to WRITE, and ProtectSystem=strict
# makes /var/lib read-only to this service.
#
# What the button does: it hands a BSC transaction hash to pcoin-wrapdesk-watch
# --released, which reads the receipt off BNB Smart Chain, refuses anything that
# does not show the right amount of wPCN reaching the right address, and only
# then records the wrap as closed in /var/lib/pcoin-wrapdesk/state.json. Without
# this grant the check passes, the write throws EROFS, and the operator is told
# a payment was recorded that was not -- the worst of the three outcomes.
#
# It must be the DIRECTORY, not the file. save_state() writes state.json.tmp and
# renames over the target, which is what stops a crash mid-write leaving a torn
# ledger; the rename needs write permission on the directory.
#
# HONEST ABOUT THE COST: that directory also holds keeper.json,
# keeper-effective.json, redeem.json and solvency.json, so this grants the panel
# write access to those too. None of them contains a key -- the keeper's private
# key is /etc/pcoin/keeper.conf, which stays read-only here, as does the rest of
# /etc/pcoin (see keeper-control.conf, which grants /etc/pcoin/control and
# deliberately not its parent). The panel is loopback-only behind Caddy and
# authenticated; this widens what an authenticated operator can reach, which is
# the point, rather than what an unauthenticated one can.
ReadWritePaths=/var/lib/pcoin-wrapdesk
