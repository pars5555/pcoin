# The keeper on the PCN index runs every minute (price plan Phase 3 Step 2,
# decision D11: "parity both ways, every minute", approved 2026-09-24).
#
# Install:  /etc/systemd/system/pcoin-wpcn-keeper.timer.d/10-every-minute.conf
#           then systemctl daemon-reload && systemctl restart pcoin-wpcn-keeper.timer
# Remove it (and daemon-reload, restart the timer) to go back to every 10 min.
#
# The base timer's "deliberately not faster" reasoning was about ONE run being
# able to spend the whole daily cap. That is no longer true: max_usdt_per_run /
# max_wpcn_per_run cap each run at $10 / 400 wPCN, so a faster timer means
# smaller steps on fresher reads, not more money at risk per read. A run that
# finds the pool inside the 3% dead band costs nothing -- a few reads, no gas.
#
# The empty OnUnitActiveSec= first CLEARS the base timer's 10min: without it
# systemd keeps both and runs on whichever is due. A oneshot still running when
# the minute comes round is not started twice.
[Timer]
OnUnitActiveSec=
OnUnitActiveSec=1min
RandomizedDelaySec=5s
AccuracySec=5s
