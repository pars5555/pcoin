# Install as /etc/systemd/system/pcoin-market.service.d/announce-spool.conf
#
# The ONE place market.pc.am may write a file: its purchase-post spool, drained
# by pcoin-purchase-announce (root). See ANNOUNCE_SPOOL in delivery.mjs for why
# the market is not given the approval queue instead.
#
# StateDirectory=, NOT ReadWritePaths=, for the reason pcoin-listing-banner's
# unit gives: systemd CREATES a StateDirectory before the process starts and
# makes it writable under ProtectSystem=strict, whereas a ReadWritePaths entry
# naming a directory that does not exist yet fails namespace setup and the
# market would not start at all.
#
# A nested path on purpose. systemd gives the INNERMOST directory to
# User=/Group= (pcoin-market) and leaves the parent /var/lib/pcoin-market
# root-owned -- so the market can write requests into the spool but cannot
# rename, replace or symlink the spool directory itself. The drainer checks
# both, and refuses a spool that is not owned by pcoin-market or is group- or
# world-writable.
[Service]
StateDirectory=pcoin-market/announce-spool
StateDirectoryMode=0700
