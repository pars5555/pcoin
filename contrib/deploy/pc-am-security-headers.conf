# pc.am security headers and Content-Security-Policy
#
# THIS IS A COPY FOR REVIEW, NOT THE FILE APACHE READS. The live copy is inside
# /etc/apache2/sites-available/pc.am.conf on 35.239.156.16. It is here because
# a control that exists only on a server is the exact failure this project has
# now hit three times (CLAUDE.md 12: price.pc.am, explorer.pc.am, the wrap
# desk). Diff the two before changing either:
#
#   ssh <pc.am host> "sudo sed -n '/SECURITY HEADERS/,/^$/p' #       /etc/apache2/sites-available/pc.am.conf"
#
# Apache is reloaded GRACEFULLY, never restarted: that box serves ~215 other
# people's vhosts on an end-of-life PHP.
#
# THE TWO sha256 HASHES ARE THE FRAGILE PART. They pin the inline <script> in
# site/app/index.html and site/pay/index.html, which is what lets those pages
# keep a strict policy instead of 'unsafe-inline' -- an injected script cannot
# run on the page that handles payment URIs. Edit either page's inline script
# and the hash stops matching and the script stops executing. pcoin-service-watch
# checks that the hash in the live header still matches the live page and
# alerts when it does not, so this cannot rot silently -- but recompute it
# deliberately when you change those scripts:
#
#   python contrib/deploy/csp-hashes.py
#
# Verified with a real browser before being enforced (report-only first, then
# enforcing): all 17 pages load with no violation. A CSP is enforced by the
# BROWSER, so curl cannot test one.

    # SECURITY HEADERS. Added 2026-09-22 after an audit found none of them.
    # Scoped to this vhost only -- this box serves ~215 other people's sites.
    #
    # `always` matters: without it these are attached to 2xx/3xx only, so the
    # 404 and 500 pages -- the ones an attacker is most likely to reach -- go
    # out bare. That is the whole class of "the header is set" that turns out
    # not to be set where it counts.
    #
    # HSTS with includeSubDomains was checked before being sent, not assumed:
    # all thirteen web hostnames under pc.am (explorer, explorer3, market,
    # price, exchange, wrapdesk, docs, pool, pcnearner, webai, checker,
    # aicontrol, 3dmodels) answer over HTTPS. seed.pc.am has no web server at
    # all -- it is a P2P A record -- so HSTS cannot affect it.
    #
    # NO `preload`. Preloading is baked into browser binaries and removal takes
    # months; max-age alone expires on its own and is the reversible version of
    # the same promise.
    #
    # NO Content-Security-Policy here yet. The homepage carries no JavaScript
    # and could take a strict one, but /app/ and /pay/ have inline scripts and
    # a single site-wide policy would either break them or be weakened to
    # 'unsafe-inline' for every page. That is a separate change with its own
    # per-directory rules.
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    <Directory /var/www/pc.am>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

### app block
    <Directory /var/www/pc.am/app>
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com 'sha256-p5QS0rfkaSA02mPNZHEC+O3BVi9dgebS/x1ngU47WuY=' https://telegram.org; connect-src 'self' https://cloudflareinsights.com https://price.pc.am https://explorer.pc.am; upgrade-insecure-requests"
        <Files "index.html">
            Header set Cache-Control "no-cache, must-revalidate"
        </Files>
    </Directory>
### pay block
    <Directory /var/www/pc.am/pay>
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com 'sha256-qSi9P7LhlwAbWbD0Rg7nFvxQr1pkm39NqjtyBWlfWVE='; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests"
        <Files "index.html">
            Header set Cache-Control "no-cache, must-revalidate"
        </Files>
    </Directory>
