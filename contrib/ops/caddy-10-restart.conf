# Caddy shipped with Restart=no, which means a crash takes down market.pc.am,
# price.pc.am, pool.pc.am, pcnearner.pc.am and explorer2.pc.am until a human
# notices. Every other service on this box is Restart=always; this was an
# oversight in the packaged unit, not a decision — nothing here wants a dead
# TLS terminator to stay dead.
#
# on-failure rather than always: a clean `systemctl stop` by an operator must
# stay stopped, or maintenance becomes a fight with systemd.
#
# The burst limit is the guard against a crash-loop hammering the box: five
# restarts inside 10 minutes and systemd gives up and leaves it failed, which
# is louder than an infinite loop and easier to see.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
